<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letterboxd Ranker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Letterboxd <span class="accent">Ranker</span></h1>
  <nav id="nav" class="hidden">
    <button id="nav-rank" class="tab active">Rank</button>
    <button id="nav-list" class="tab">My List</button>
    <span id="whoami"></span>
    <button id="switch-user" class="link-btn">switch</button>
  </nav>
</header>

<main>
  <section id="view-setup">
    <div class="card setup-card">
      <h2>Who's ranking?</h2>
      <p class="muted">Pulls your recent watches from your Letterboxd RSS feed.</p>
      <form id="setup-form">
        <input id="username-input" type="text" placeholder="letterboxd username" autocomplete="off" spellcheck="false">
        <button type="submit" class="primary">Start</button>
      </form>
      <p id="setup-error" class="error hidden"></p>
    </div>
  </section>

  <section id="view-compare" class="hidden">
    <p id="progress" class="muted center"></p>
    <h2 class="center" id="compare-question">Which is better?</h2>
    <div class="duel">
      <div class="contender" id="side-candidate">
        <div class="poster-wrap"><img id="poster-candidate" alt=""></div>
        <div class="contender-info">
          <span class="film-title" id="title-candidate"></span>
          <span class="film-year" id="year-candidate"></span>
          <span class="badge new">placing</span>
        </div>
        <button class="choice better" id="btn-better">Better than →</button>
      </div>
      <div class="vs">vs</div>
      <div class="contender" id="side-pivot">
        <div class="poster-wrap"><img id="poster-pivot" alt=""></div>
        <div class="contender-info">
          <span class="film-title" id="title-pivot"></span>
          <span class="film-year" id="year-pivot"></span>
          <span class="badge ranked" id="pivot-rank"></span>
        </div>
        <button class="choice worse" id="btn-worse">← Worse than</button>
      </div>
    </div>
    <div class="secondary-actions">
      <button id="btn-cantrate" class="neutral">Can't rate — call it a tie</button>
      <button id="btn-skip" class="link-btn">skip this film</button>
      <button id="btn-undo" class="link-btn">undo</button>
    </div>
  </section>

  <section id="view-done" class="hidden">
    <div class="card center">
      <h2>All caught up 🎬</h2>
      <p class="muted">Every film from your feed is ranked. Watch more movies, then hit refresh.</p>
      <button id="btn-refresh" class="primary">Refresh feed</button>
    </div>
  </section>

  <section id="view-list" class="hidden">
    <div class="list-head">
      <h2>My ranking</h2>
      <button id="btn-refresh-2" class="link-btn">refresh feed</button>
    </div>
    <ol id="ranking"></ol>
    <div id="skipped-section" class="hidden">
      <h3 class="muted">Skipped</h3>
      <ul id="skipped"></ul>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
